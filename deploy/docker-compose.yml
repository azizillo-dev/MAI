# Mentor AI — server: Postgres + API + Caddy (avtomatik HTTPS, Let's Encrypt)
# Ishga tushirish:  cd deploy && cp .env.production.example .env && nano .env && docker compose up -d --build

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mentor_ai
      POSTGRES_USER: mentor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentor -d mentor_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://mentor:${POSTGRES_PASSWORD}@db:5432/mentor_ai
      PUBLIC_API_URL: https://${DOMAIN:?DOMAIN kerak}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
